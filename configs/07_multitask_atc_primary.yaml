experiment_name: "07_multitask_atc_primary"

model:
  architecture: "gat"
  hidden_dim: 128
  num_layers: 5
  dropout: 0.2
  heads: 3
  pooling: "mean"  # Mean was best for ATC

training:
  epochs: 300
  batch_size: 32
  lr: 0.0001
  seed: 42
  task_weights: "atc:1.0,side_effects:0.5,maccs:0.3"

data:
  train_tasks: "atc,side_effects,maccs"
  eval_tasks: "atc"

# Experiment 7: ATC as primary task
# Tests if auxiliary tasks help ATC (hardest task)
# Uses mean pooling (best for ATC in single-task)
