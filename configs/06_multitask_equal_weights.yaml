experiment_name: "06_multitask_equal_weights"

model:
  architecture: "gat"
  hidden_dim: 128
  num_layers: 5
  dropout: 0.2
  heads: 3
  pooling: "attention"

training:
  epochs: 300
  batch_size: 32
  lr: 0.0001
  seed: 42
  task_weights: "side_effects:1.0,atc:1.0,maccs:1.0"

data:
  train_tasks: "side_effects,atc,maccs"
  eval_tasks: "side_effects"

# Experiment 6: Equal task weights
# Tests if balanced training helps vs weighted (05)
