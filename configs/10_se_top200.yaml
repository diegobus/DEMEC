experiment_name: "10_se_top200"

model:
  architecture: "gat"
  hidden_dim: 128
  num_layers: 5
  dropout: 0.2
  heads: 3
  pooling: "attention"

training:
  epochs: 300
  batch_size: 32
  lr: 0.0001
  seed: 42

data:
  train_tasks: "side_effects"
  eval_tasks: "side_effects"
  max_side_effects: 200  # Top 200 most common side effects

# Experiment 10: Test impact of side effect count
