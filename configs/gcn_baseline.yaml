# GCN Baseline Configuration
# Simple GCN with mean pooling for comparison

experiment_name: "gcn_baseline"

model:
  architecture: "gcn"
  input_dim: 154
  hidden_dim: 128
  num_layers: 5
  dropout: 0.2
  pooling: "mean"

training:
  epochs: 300
  batch_size: 32
  lr: 0.0001
  seed: 42
  task_weights: "side_effects:1.0,atc:1.0,maccs:1.0"
  focal_alpha: 0.25

data:
  train_tasks: "side_effects,atc,maccs"
  eval_tasks: "side_effects"
  graphs_dir: "data/processed/graphs_v2/"
  feature_key: "x"
  max_side_effects: 100
