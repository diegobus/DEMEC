experiment_name: "05_multitask_weighted"

model:
  architecture: "gat"  # GAT performs better on ATC
  hidden_dim: 128
  num_layers: 5
  dropout: 0.2
  heads: 3
  pooling: "attention"  # Best for SE and MACCS

training:
  epochs: 300  # Shorter for multitask comparison
  batch_size: 32
  lr: 0.0001  # Match tuned hyperparameters
  seed: 42
  task_weights: "side_effects:1.0,atc:0.8,maccs:0.2"

data:
  train_tasks: "side_effects,atc,maccs"
  eval_tasks: "side_effects"

# Experiment 5: Multi-task with weighted loss
# SE loss: 1.0, ATC loss: 0.8, MACCS loss: 0.2
# Tests if auxiliary tasks help side effect prediction
