experiment_name: "09_se_top100"

model:
  architecture: "gat"
  hidden_dim: 128
  num_layers: 5
  dropout: 0.2
  heads: 3
  pooling: "attention"

training:
  epochs: 300
  batch_size: 32
  lr: 0.0001
  seed: 42

data:
  train_tasks: "side_effects"
  eval_tasks: "side_effects"
  max_side_effects: 100  # Top 100 most common side effects

# Experiment 9: Test impact of side effect count
# Hypothesis: Fewer classes may improve performance (less label noise)
