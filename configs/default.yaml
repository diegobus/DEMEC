experiment_name: "default_gcn_experiment"

model:
  architecture: "gcn"  # Options: "gcn", "gat"
  hidden_dim: 64
  num_layers: 5
  dropout: 0.2
  heads: 3             # Only used for GAT
  node_dim: 1

training:
  epochs: 10
  batch_size: 32
  lr: 0.001
  seed: 42

data:
  graphs_dir: "data/processed/graphs/"
  feature_key: null    # e.g., "emb" or null
  tasks:
    side_effects: "data/processed/cid_se_matrix.csv"
    atc: "data/processed/cid_atc_l3_matrix.csv"
    maccs: "data/processed/cid_maccs_matrix.csv"
