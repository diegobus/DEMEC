experiment_name: "gcn_mlp_pooling"

model:
  architecture: "gcn"
  hidden_dim: 64
  num_layers: 5
  dropout: 0.2
  heads: 3
  pooling: "mlp"  # MLP transforms nodes before pooling

training:
  epochs: 50
  batch_size: 32
  lr: 0.001
  seed: 42

data:
  train_tasks: "side_effects"
  eval_tasks: "side_effects"
