experiment_name: "multitask_gat_baseline"

model:
  architecture: "gat"
  hidden_dim: 64
  num_layers: 5
  dropout: 0.2
  heads: 3

training:
  epochs: 50
  batch_size: 32
  lr: 0.001
  seed: 42

data:
  hetero: true
  # max_side_effects: 200
  graphs_dir: "data/processed/graphs_v2/"
  feature_key: "atom_features"
  train_tasks: "side_effects,atc,maccs"
  eval_tasks: "side_effects"
